<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Get Method Request</h1>
    
    
    <form action="../getmethod" method="get">
    		<label>Enter name : </label>
    		<input type="text" placeholder="Enter name" name="uname">
    		
    		<br>
    		<label>Select Gender : </label>
    		<input type="radio" name="gender" value="male">Male
    		<input type="radio" name="gender" value="female">Female
    		<br>
    		
    		<label>Select Hobbies : </label>
    		<input type ="checkbox" name="hobby" value="reading">Reading
    		<input type ="checkbox" name="hobby" value="writing">Writing
    		<input type ="checkbox" name="hobby" value="listening">Listening
    		<input type ="checkbox" name="hobby" value="speaking">Speaking
    		<input type="submit">
    </form>
</body>
</html>
